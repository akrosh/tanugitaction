name: First_Workflow_tanu_dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:   #runs the workflow manually

jobs:
  basic-demo_1:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello and show Linux version 
        run: | 
            echo "Hello from Tanuja Technologies"
            uname -a

      - name: List current directory
        run: ls -ltr

      - name: Print current user
        run: whoami

      - name: Print date and time
        run: date
      - name: print hostname
        run: hostname
