name: akrosh_Workflow_dev_v1

on:

  workflow_dispatch:   #runs the workflow manually

jobs:
  basic-demo_1:
    runs-on: ubuntu-latest

    steps:
      env:
        name:"akrosh"
        company:"opt"
      - name: Say Hello multipale step run
      
        run: |
          echo "Hello from Tanuja Technologies"
          date
          uname -a
          echo "Hellow $name . are you working in $company "

      - name: List current directory
        run: ls -ltr

      - name: Print current user
        run: whoami

      - name: Print date and time
        run: date
      - name: print hostname
        run: hostname
